<script>
(function(){
  var menu = document.querySelector('.nav-links');
  var burger = document.querySelector('.burger');
  var groups = document.querySelectorAll('.nav-group');
  function norm(p){ return p.replace(/index\.html$/, ''); }
  // Highlight the group that contains the current page (path + hash).
  function mark(){
    var here = norm(location.pathname), hash = location.hash || (here === '{{ site.baseurl }}/' ? '#home' : '');
    groups.forEach(function(g){
      var hit = false;
      g.querySelectorAll('.nav-sub a').forEach(function(a){
        var p = norm(a.pathname);
        if (a.hash ? (p === here && a.hash === hash) : (here.indexOf(p) === 0)) hit = true;
      });
      g.querySelector('.nav-top').classList.toggle('on', hit);
    });
  }
  mark();
  window.addEventListener('hashchange', function(){
    mark(); menu.classList.remove('open'); burger.setAttribute('aria-expanded','false');
    if (document.activeElement && menu.contains(document.activeElement)) document.activeElement.blur(); // close dropdown
  });
  burger.addEventListener('click', function(){
    var o = menu.classList.toggle('open'); burger.setAttribute('aria-expanded', o ? 'true' : 'false');
  });
})();
</script>
