# ─────────────────────────────────────────────────────────────────────────────
# EVERYONE in the group — current and alumni — lives in this ONE file.
# One entry per person. The People page has two blocks, CURRENT and ALUMNI,
# each split into three levels: Postdoc, Doctoral (D.Eng.), Master's (M.Eng.).
#
#   status: current + level: postdoc → Current · Postdoctoral researchers
#   status: current + level: deng    → Current · Doctoral students (D.Eng.)
#   status: current + level: meng    → Current · Master's students (M.Eng.)
#
#   postdoc: <period>  → Alumni · Postdoctoral researchers
#   deng: <year>       → Alumni · Doctoral graduates (D.Eng.)
#   meng: <year>       → Alumni · Master's graduates (M.Eng.)
#
# The current groups place people by `level`; the alumni groups place people by
# the degree/stint markers (deng / meng / postdoc). A person can carry more than
# one marker — someone who earned a D.Eng. here and then did a postdoc here shows
# in both alumni grids from one entry. You never edit HTML — only this file.
#
# A sub-group with nobody in it simply does not appear. Add the first person and
# it shows up automatically.
#
# This file is regenerated by tools/make_people.py when new member forms come in,
# but the script only adds/updates current members; it never removes alumni.
# Hand-editing between runs is fine.
#
# ── Fields ───────────────────────────────────────────────────────────────────
#   name     required. No "Dr." — the role line shows the level.
#   status   current | alumnus | example   (example never displays)
#   level    current members only: postdoc | deng | meng   (which current group)
#   role     current members only: free text, e.g. "Doctoral student" (display)
#   since    current members only: year they joined
#   topic    current members only: one sentence, plain English, no acronyms
#   deng     year a Doctoral degree (D.Eng.) was earned here → Doctoral graduates
#   meng     year a Master's degree (M.Eng.) was earned here → Master's graduates
#   thesis   thesis title (HTML like Na<sub>0.44</sub>MnO<sub>2</sub> is fine)
#   postdoc  postdoc period here, e.g. "2022–2026" → Postdoctoral alumni
#   now      where they are now. OMIT if still at Chulalongkorn.
#   photo    square JPEG in img/people/. Omit → a placeholder shows.
#   link     ORCID / Google Scholar URL. Optional.
# ─────────────────────────────────────────────────────────────────────────────

# ── Current members ──────────────────────────────────────────────────────────
# Add current postdocs / D.Eng. students / M.Eng. students here, each with
# status: current and a level: (postdoc | deng | meng). Example:
#
#   - name: Somchai Example
#     status: current
#     level: deng
#     role: Doctoral student
#     since: 2025
#     topic: Solid electrolytes for sodium batteries.
#     photo: somchai-example.jpg
#     link: https://orcid.org/0000-0000-0000-0000

