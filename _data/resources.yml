# ─────────────────────────────────────────────────────────────────────────────
# Files and tools for lab members, shown on /resources/. One block per resource.
#
# ── Fields ───────────────────────────────────────────────────────────────────
#   title        required. Name of the resource.
#   description  what it is and when to use it (1–3 sentences).
#   files        the downloadable files, each with:
#       label  short name shown to the reader
#       file   filename inside the  files/  folder
#       kind   short tag: PDF | PY | MD | ZIP | XLSX ...
#       desc   one line about that specific file
#
# To add a file: drop it in  files/  and add a block here.
# ─────────────────────────────────────────────────────────────────────────────

- title: Lab figure palette — Teal &amp; Amber
  howto: palette
  description: >
    The colour system for every figure we publish: papers, theses, posters, and slides.
    Drawing every figure from the same colours — in the same order and with the same
    meanings — is what makes our output recognisable, and it keeps figures readable for
    colour-blind readers and in greyscale, which most journals require. Start with the
    style guide, pin up the reference sheet, and apply it with the Python module or the
    AI prompt.
  files:
    - label: Style guide
      file: lab_palette_guide.pdf
      kind: PDF
      desc: Full specification — exact colour values, semantic roles, accessibility validation, and per-tool setup (Python, R, Illustrator, LaTeX, CSS).
    - label: Reference sheet
      file: lab_palette_sheet.pdf
      kind: PDF
      desc: One-page swatch card with every value and rule — print it and pin it up by your desk.
    - label: Python module — labpalette.py
      file: labpalette.py
      kind: PY
      desc: "matplotlib / seaborn house style in one call: import labpalette as lp; lp.apply(). Colour cycle, colormaps, fonts, and 600 dpi export."
    - label: AI prompt pack
      file: skh-figure-palette-ai-prompt.md
      kind: MD
      desc: Paste into ChatGPT / Claude / Gemini so any figure it generates uses the palette correctly — colours, order, ramps, and rules.
