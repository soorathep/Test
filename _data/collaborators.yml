# ─────────────────────────────────────────────────────────────────────────────
# Collaborators shown on /collaborators/ — one entry per person.
# Each entry places a marker on the world map (by lat/lng) and a card in the list.
#
# ── Fields ───────────────────────────────────────────────────────────────────
#   name         required.
#   affiliation  required. Institution / university.
#   city         city of the institution.
#   country      country — cards are grouped by this.
#   lat, lng     decimal degrees of the institution (for the map marker).
#                Look up the campus on Google Maps; right-click → the numbers are
#                lat, lng in that order.
#   photo        square JPEG in img/collaborators/. Omit → a placeholder shows.
#   link         ORCID / personal or lab website. Optional.
#
# The entries below are seeded from recent co-authorships and research visits on
# this site — please review, correct affiliations, add photos, and extend.
# ─────────────────────────────────────────────────────────────────────────────

