# ─────────────────────────────────────────────────────────────────────────────
# 2105603 Advanced Chemical Engineering Thermodynamics — course page data.
# Drives /teaching/2105603/. Same pattern as rcs2026.yml.
#
# modules   one entry per teaching module. `slides` is the rendered Quarto deck
#           in teaching/2105603/; `files` are downloads in
#           teaching/2105603/files/.
#
# NOTE Deliberately no weekly schedule and no assessment table here. Both are
#      still under discussion between the co-instructors, and nothing goes on a
#      public course page until it comes from the registered syllabus rather
#      than from a draft. To add them back, put a `weeks:` or `assessment:`
#      list here and uncomment the matching block in index.html.
# ─────────────────────────────────────────────────────────────────────────────
code: "2105603"
credits: "3 (3-0-9)"
semester: "Semester 1 / 2026"
sections: "Graduate · M.Eng. and Ph.D. Chemical Engineering"
instructors: "Chanon Pornrungroj · Soorathep Kheawhom"

description: >-
  Introduction to molecular thermodynamics, equations of state, equations for
  activity coefficients, thermodynamic property determination, multicomponent
  phase equilibrium, process analysis, and chemical equilibrium.

modules:
  - id: eos
    n: 1
    title: Evolution of Equations of State
    subtitle: A physics-driven perspective
    slides: eos.html
    blurb: >-
      Fifty-six slides tracing one argument: every equation of state was written
      because the previous one omitted physics that turned out to matter. Ideal
      gas to van der Waals to the cubics to SAFT to electrolyte models, with the
      cost of each addition made explicit.
    files:
      - kind: Notes
        file: EOS_Lecture_Notes.pdf
        label: Lecture notes
        desc: Full derivations behind every slide, 87 pages
      - kind: Examples
        file: EOS_Worked_Examples.pdf
        label: Worked examples
        desc: Four problems worked end to end with the arithmetic shown
      - kind: Slides
        file: eos-slides.pdf
        label: Slides as PDF
        desc: For annotating or printing; the browser version is the primary one
      - kind: Code
        file: eos-notebooks.zip
        label: Jupyter notebooks
        desc: Three runnable notebooks — cubic EOS from scratch, the Maxwell construction, cubic against PC-SAFT
      - kind: Code
        file: EOS_Python_Toolkit.zip
        label: Figure toolkit
        desc: Every figure in the deck, with the Python that generates it
