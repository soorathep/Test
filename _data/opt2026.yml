# ─────────────────────────────────────────────────────────────────────────────
# 2105623 Optimization of Chemical Processes
# Semester 1 / 2026. Drives /teaching/2105623/.
#
#   weeks[]
#     n       week number, or "—" for a break in the term
#     title   session title
#     dates   "10 Aug"  — the Monday session
#     block   which part of the course this session belongs to
#     tool    the hands-on tool for that session
#     slides  optional. File name under teaching/2105623/, e.g. w01.html.
#             Add it and the link appears by itself.
#     files[] optional. Student downloads for that week. Each entry:
#               name  what the student sees
#               desc  one line
#               kind  PDF | XLSX | Notebook  — the little label on the card
#               file  path under files/2105623/, e.g. w01/w01-product-mix.xlsx
#             Drop the file in files/2105623/ and add the entry; the card
#             appears on the course page by itself. Never list a solution file.
#
#   documents[]  course-wide downloads, same four keys, shown above the weeks
#
#   assessment[]  weight · component · asks
# ─────────────────────────────────────────────────────────────────────────────

