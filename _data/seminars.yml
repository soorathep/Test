# Standalone seminars and invited talks, shown on /teaching/seminars/.
# One entry per talk, newest first is handled by the page (sorted by date).
#   title    required.
#   date     required. YYYY-MM-DD — drives the ordering and the displayed date.
#   venue    optional. Where it was given.
#   note     optional one line.
#   slides   optional. Filename of the rendered deck in teaching/seminars/.
