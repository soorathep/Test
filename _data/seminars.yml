# Standalone seminars and invited talks, shown on /teaching/seminars/.
# One entry per talk, newest first is handled by the page (sorted by date).
#   title   required.
#   date    required. YYYY-MM-DD — drives the ordering and the displayed date.
#   venue   optional. Where it was given.
#   note    optional one line.
#   slides  optional. Filename of the rendered deck in teaching/seminars/.
#           Present = the title becomes a link. Source lives in
#           _teaching-src/seminars/.
# ─────────────────────────────────────────────────────────────────────────────

- title: Making Conferences Work for You
  date: 2026-08-17
  venue: Department of Chemical Engineering, Chulalongkorn University
  slides: conferences.html
  note: Choosing a meeting that matches the stage your work is at, planning backward from the abstract deadline, designing a talk and a poster for the time you are given, handling questions in English, and what to do in the first 48 hours after you return.
