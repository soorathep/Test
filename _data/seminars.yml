- title: "Beyond the Summary: How to Plan, Structure, and Place a High-Impact Review Article"
  date: 2026-09-09
  venue: MMS3 Talk, Department of Chemical Engineering, Chulalongkorn University
  slides: review-articles.html
  handout: Beyond_the_Summary_Handout.pdf
  note: For researchers writing their first review. The ten things called a review and how they actually differ, what a review does and does not do for an early-career profile, a five-gate test for deciding whether a topic is ready, what counts as a contribution when you have no new data, the eight-step process from idea to submission, where AI tools legitimately fit, and the structure of the finished paper down to the title.

- title: Making Conferences Work for You
  date: 2026-08-17
  venue: Department of Chemical Engineering, Chulalongkorn University
  slides: conferences.html
  note: Choosing a meeting that matches the stage your work is at, planning backward from the abstract deadline, designing a talk and a poster for the time you are given, handling questions in English, and what to do in the first 48 hours after you return.
