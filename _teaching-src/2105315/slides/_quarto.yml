# 2105315 session decks: Quarto + Reveal.js with narration (English or Thai) and captions (English or Thai).
# Render from this folder:  quarto render s01.qmd && python3 publish.py
# The theme and click-to-advance script are shared with the 2105603 decks (../../2105603/theme/).
project:
  type: default
  output-dir: _site
  resources:
    - narration/**

format:
  revealjs:
    theme: [default, ../../2105603/theme/teal-amber.scss]
    css: slides.css
    width: 1280
    height: 720
    margin: 0.06
    center: false
    auto-stretch: false
    slide-number: c/t
    progress: true
    hash: true
    transition: none
    menu: false
    controls: true
    controlsLayout: edges
    controlsBackArrows: visible
    html-math-method: plain
    embed-resources: false
    include-in-header:
      text: '<meta name="robots" content="noindex">'
    include-after-body:
      - ../../2105603/theme/click-advance.html
      - narration-player.html
