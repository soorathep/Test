<!-- Narration and captions for 2105315 decks (adapted from the 2105603 player).
     Loads narration/<deck>.json (built by build_narration.py): per slide, the sentences in English
     and Thai, and for each voice an MP3 with one cue per sentence.
     Controls at the bottom left:
       Narration: off / English / ไทย     Pause or Resume, Replay (while narration is on)
       Captions:  off / English / ไทย     Auto-advance: off / on
     Captions follow the voice sentence by sentence, in either language (Thai voice with English
     captions works, and the reverse). With narration off and captions on, the slide's full text
     is shown to read. Settings are remembered in this browser. -->
<style>
.nr-bar { position: fixed; left: 12px; bottom: 10px; z-index: 40; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 120px); font: 600 14px/1 "Source Sans 3", "Course Thai", sans-serif; }
.nr-bar button { border: 1.5px solid #0F6E6B; background: #fff; color: #0F6E6B; border-radius: 4px; padding: 8px 12px; cursor: pointer; font: inherit; }
.nr-bar button[aria-pressed="true"] { background: #0F6E6B; border-color: #0F6E6B; color: #fff; }
.nr-bar button:focus-visible { outline: 2px solid #E29A2D; outline-offset: 2px; }
/* When captions show, the slide area shrinks by --cc-band so captions never cover slide text. */
.reveal { height: calc(100% - var(--cc-band, 0px)) !important; }
.nr-caption { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 39; width: min(1100px, 92vw); max-height: 22vh; overflow-y: auto;
  background: rgba(28,36,43,.92); color: #fff; border-radius: 4px; padding: 10px 16px; font: 400 21px/1.45 "Source Sans 3", "Course Thai", sans-serif; text-align: center; }
.nr-caption.transcript { text-align: left; font-size: 18px; }
.nr-caption.transcript p { margin: 0 0 .4em; }
.nr-caption[lang="th"] { font-family: "Course Thai", "Sarabun", sans-serif; }
.nr-voice-note { font: 400 12px/1 "Source Sans 3", sans-serif; color: #66727C; align-self: center; margin-left: 4px; }
.draft-mark { align-self: center; margin-left: 8px; font: 400 12px/1 "Source Sans 3", sans-serif; color: #66727C !important; text-decoration: none; }
.draft-mark:hover { text-decoration: underline; }
@media (max-width: 700px) { .nr-bar { font-size: 12px; } .nr-bar button { padding: 6px 8px; } .nr-caption { font-size: 17px; bottom: 92px; } .nr-voice-note, .draft-mark { display: none; } }
@media print { .nr-bar, .nr-caption { display: none !important; } }
</style>
<div class="nr-bar" role="toolbar" aria-label="Narration and captions">
  <button type="button" id="nr-sound" aria-pressed="false">Narration: off</button>
  <button type="button" id="nr-pause" hidden>Pause</button>
  <button type="button" id="nr-replay" hidden>Replay slide</button>
  <button type="button" id="nr-cc" aria-pressed="false">Captions: off</button>
  <button type="button" id="nr-auto" aria-pressed="false">Auto-advance: off</button>
  <span class="nr-voice-note" id="nr-voice-note" hidden>Thai voice: draft recording</span>
  <a class="draft-mark" href="../labs/index.html">2105315 labs</a>
</div>
<div class="nr-caption" id="nr-caption" aria-live="polite" hidden></div>
<script>
(function () {
  const deck = location.pathname.split('/').pop().replace(/\.html$/, '') || 'index';
  const store = { get(k, d) { try { return localStorage.getItem('nr315-' + k) ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem('nr315-' + k, v); } catch {} } };
  const NEXT = { off: 'en', en: 'th', th: 'off' };
  // Narration cycles only through voices this deck has (Thai is off until recordings are added).
  let voices = ['en', 'th'];
  const nextVoice = (v) => { const order = ['off', ...voices]; return order[(order.indexOf(v) + 1) % order.length]; };
  const SOUND_LABEL = { off: 'Narration: off', en: 'Narration: English', th: 'Narration: ไทย' };
  const CC_LABEL = { off: 'Captions: off', en: 'Captions: English', th: 'Captions: ไทย' };
  const state = { sound: store.get('sound', 'off'), cc: store.get('cc', 'off'), auto: store.get('auto', 'off') === 'on' };
  if (!NEXT[state.sound]) state.sound = 'off';
  if (!NEXT[state.cc]) state.cc = 'off';
  const audio = new Audio(); audio.preload = 'auto';
  const box = document.getElementById('nr-caption');
  const $ = (id) => document.getElementById(id);
  let data = {}, slide = null, band = -1;

  function setBand() {
    const h = box.hidden ? 0 : box.offsetHeight + 64;
    if (h === band) return;
    band = h;
    document.documentElement.style.setProperty('--cc-band', h + 'px');
    if (window.Reveal && Reveal.isReady()) Reveal.layout();
  }
  new ResizeObserver(setBand).observe(box);

  const on = () => state.sound !== 'off';
  function paintButtons() {
    $('nr-sound').textContent = SOUND_LABEL[state.sound]; $('nr-sound').setAttribute('aria-pressed', on());
    $('nr-pause').hidden = !on(); $('nr-replay').hidden = !on();
    $('nr-pause').textContent = audio.paused && audio.currentTime > 0 && !audio.ended ? 'Resume' : 'Pause';
    $('nr-cc').textContent = CC_LABEL[state.cc]; $('nr-cc').setAttribute('aria-pressed', state.cc !== 'off');
    $('nr-auto').textContent = 'Auto-advance: ' + (state.auto ? 'on' : 'off'); $('nr-auto').setAttribute('aria-pressed', state.auto);
    $('nr-voice-note').hidden = state.sound !== 'th';
  }
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function show(html, transcript) {
    if (state.cc === 'off' || !html) { box.hidden = true; return; }
    box.lang = state.cc; box.classList.toggle('transcript', !!transcript); box.innerHTML = html; box.hidden = false;
  }
  function transcript() {
    const text = slide?.text || [];
    show(text.map((s) => '<p>' + esc(s[state.cc] || '') + '</p>').join(''), true);
  }
  function syncCaption() {
    const track = slide?.[state.sound]; if (!track) return;
    const t = audio.currentTime;
    const i = track.cues.findIndex(([a, b]) => t >= a && t < b + 0.3);
    if (i >= 0) show(esc(slide.text[i]?.[state.cc] || ''), false);
  }
  function load() {
    const id = Reveal.getCurrentSlide()?.id;
    slide = data[id] || null;
    audio.pause();
    if (!slide) { box.hidden = true; return; }
    const track = on() ? slide[state.sound] : null;
    if (track) {
      audio.src = track.audio; audio.currentTime = 0;
      audio.play().catch((err) => {
        // A newer load interrupts an older play() (AbortError): not a failure. Blocked autoplay: fall back to text.
        if (err && err.name === 'AbortError') return;
        state.sound = 'off'; paintButtons(); transcript();
      });
      box.hidden = true;
    } else transcript();
  }
  audio.addEventListener('play', paintButtons);
  audio.addEventListener('pause', paintButtons);
  audio.addEventListener('timeupdate', () => { if (on()) syncCaption(); });
  audio.addEventListener('ended', () => { if (state.auto && !Reveal.isLastSlide()) Reveal.next(); });
  $('nr-pause').addEventListener('click', (e) => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); e.currentTarget.blur(); });
  $('nr-replay').addEventListener('click', (e) => { if (slide) { audio.currentTime = 0; audio.play().catch(() => {}); } e.currentTarget.blur(); });
  $('nr-sound').addEventListener('click', (e) => { state.sound = nextVoice(state.sound); store.set('sound', state.sound); paintButtons(); load(); e.currentTarget.blur(); });
  $('nr-cc').addEventListener('click', (e) => {
    state.cc = NEXT[state.cc]; store.set('cc', state.cc); paintButtons();
    if (on() && !audio.paused) syncCaption(); else if (on()) box.hidden = true; else transcript();
    e.currentTarget.blur();
  });
  $('nr-auto').addEventListener('click', (e) => { state.auto = !state.auto; store.set('auto', state.auto ? 'on' : 'off'); paintButtons(); e.currentTarget.blur(); });

  paintButtons();
  fetch('narration/' + deck + '.json').then((r) => r.ok ? r.json() : {}).then((d) => {
    data = d;
    voices = ['en', 'th'].filter((v) => Object.values(d).some((s) => s[v]));
    if (state.sound !== 'off' && !voices.includes(state.sound)) state.sound = voices[0] || 'off';
    paintButtons();
    if (Reveal.isReady()) load(); else Reveal.on('ready', load);
    Reveal.on('slidechanged', load);
  }).catch(() => { document.querySelector('.nr-bar').hidden = true; });
})();
</script>
