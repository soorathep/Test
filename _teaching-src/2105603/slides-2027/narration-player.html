<!-- Narration and captions for 2027 decks.
     Loads narration/<deck>.json (built by build_narration.py): per slide, an MP3 and
     sentence cues with English and Thai text. Controls at the bottom left:
     narration on/off, captions off/English/Thai, auto-advance on/off.
     With narration off and captions on, the slide's full text is shown to read. -->
<style>
.nr-bar { position: fixed; left: 12px; bottom: 10px; z-index: 40; display: flex; gap: 6px; font: 600 14px/1 "Source Sans 3", "Course Thai", sans-serif; }
.nr-bar button { border: 1.5px solid #0F6E6B; background: #fff; color: #0F6E6B; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
.nr-bar button[aria-pressed="true"] { background: #0F6E6B; border-color: #0F6E6B; color: #fff; }
.nr-bar button:focus-visible { outline: 2px solid #E29A2D; outline-offset: 2px; }
.nr-caption { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 39; width: min(960px, 86vw); max-height: 30vh; overflow-y: auto;
  background: rgba(28,36,43,.9); color: #fff; border-radius: 4px; padding: 10px 16px; font: 400 21px/1.45 "Source Sans 3", "Course Thai", sans-serif; text-align: center; }
.nr-caption.transcript { text-align: left; font-size: 18px; }
.nr-caption.transcript p { margin: 0 0 .4em; }
.nr-caption[lang="th"] { font-family: "Course Thai", "Sarabun", sans-serif; }
.reveal-viewport.dark-slide .nr-bar button:not([aria-pressed="true"]) { background: rgba(255,255,255,.85); }
.draft-mark { align-self: center; margin-left: 8px; font: 400 12px/1 "Source Sans 3", sans-serif; color: #66727C !important; text-decoration: none; }
.draft-mark:hover { text-decoration: underline; }
@media print { .draft-mark { display: none; } }
</style>
<div class="nr-bar" role="toolbar" aria-label="Narration and captions">
  <button type="button" id="nr-sound" aria-pressed="false">Narration (EN): off</button>
  <button type="button" id="nr-cc" aria-pressed="false">Captions: off</button>
  <button type="button" id="nr-auto" aria-pressed="false">Auto-advance: off</button>
  <a class="draft-mark" href="../index.html">Draft for 2027 · current class: course page</a>
</div>
<div class="nr-caption" id="nr-caption" aria-live="polite" hidden></div>
<script>
(function () {
  const deck = location.pathname.split('/').pop().replace(/\.html$/, '') || 'index';
  const store = { get(k, d) { try { return localStorage.getItem('nr-' + k) ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem('nr-' + k, v); } catch {} } };
  const state = { sound: store.get('sound', 'off') === 'on', cc: store.get('cc', 'off'), auto: store.get('auto', 'off') === 'on' };
  const CC_NEXT = { off: 'en', en: 'th', th: 'off' }, CC_LABEL = { off: 'Captions: off', en: 'Captions: English', th: 'Captions: ไทย' };
  const audio = new Audio(); audio.preload = 'auto';
  const box = document.getElementById('nr-caption');
  const $ = (id) => document.getElementById(id);
  let data = {}, slide = null;

  function paintButtons() {
    $('nr-sound').textContent = 'Narration (EN): ' + (state.sound ? 'on' : 'off'); $('nr-sound').setAttribute('aria-pressed', state.sound);
    $('nr-cc').textContent = CC_LABEL[state.cc]; $('nr-cc').setAttribute('aria-pressed', state.cc !== 'off');
    $('nr-auto').textContent = 'Auto-advance: ' + (state.auto ? 'on' : 'off'); $('nr-auto').setAttribute('aria-pressed', state.auto);
  }
  function show(html, transcript) {
    if (state.cc === 'off' || !html) { box.hidden = true; return; }
    box.lang = state.cc; box.classList.toggle('transcript', !!transcript); box.innerHTML = html; box.hidden = false;
  }
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function transcript() {
    const cues = slide?.cues || [];
    show(cues.map((c) => '<p>' + esc(c[state.cc] || '') + '</p>').join(''), true);
  }
  function syncCaption() {
    const cues = slide?.cues || [], t = audio.currentTime;
    const cue = cues.find((c) => t >= c.start && t < c.end + 0.3) || null;
    if (cue) show(esc(cue[state.cc] || ''), false);
  }
  function load() {
    const id = Reveal.getCurrentSlide()?.id;
    slide = data[id] || null;
    audio.pause();
    if (!slide) { box.hidden = true; return; }
    if (state.sound) {
      audio.src = slide.audio; audio.currentTime = 0;
      audio.play().catch(() => { state.sound = false; paintButtons(); transcript(); });
      box.hidden = true;
    } else transcript();
  }
  audio.addEventListener('timeupdate', () => { if (state.sound) syncCaption(); });
  audio.addEventListener('ended', () => { if (state.auto && !Reveal.isLastSlide()) Reveal.next(); });

  $('nr-sound').addEventListener('click', (e) => { state.sound = !state.sound; store.set('sound', state.sound ? 'on' : 'off'); paintButtons(); load(); e.currentTarget.blur(); });
  $('nr-cc').addEventListener('click', (e) => { state.cc = CC_NEXT[state.cc]; store.set('cc', state.cc); paintButtons();
    if (state.sound && !audio.paused) syncCaption(); else if (state.sound) box.hidden = true; else transcript(); e.currentTarget.blur(); });
  $('nr-auto').addEventListener('click', (e) => { state.auto = !state.auto; store.set('auto', state.auto ? 'on' : 'off'); paintButtons(); e.currentTarget.blur(); });

  paintButtons();
  fetch('narration/' + deck + '.json').then((r) => r.ok ? r.json() : {}).then((d) => {
    data = d;
    if (Reveal.isReady()) load(); else Reveal.on('ready', load);
    Reveal.on('slidechanged', load);
  }).catch(() => { document.querySelector('.nr-bar').hidden = true; });
})();
</script>
