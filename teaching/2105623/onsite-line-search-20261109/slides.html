<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onsite teaching slides</title><style>body{font:18px/1.6 Arial,Tahoma,sans-serif;color:#333F4A;max-width:1100px;margin:30px auto;padding:0 22px}h1,h2,a{color:#0F6E6B}button,select{font:inherit;padding:7px;margin:4px}img{width:100%}nav{margin:15px 0}aside{border-left:4px solid #E29A2D;padding:12px 18px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd}section{break-inside:avoid}@page{size:A4;margin:15mm}@media print{body{font-size:10pt;margin:0}nav,button{display:none}h2{font-size:12pt}section{margin-bottom:12px}}</style><body><nav><a href="index.html">Materials</a> · <a href="demo.html" target="_blank">All demos</a> · <a href="Onsite-LP-NLP-Line-Search.pdf">PDF</a></nav><div><button id="prev">Previous</button><label>Slide <select id="choose"></select></label><button id="next">Next</button><a id="demo" target="_blank" hidden>Open interactive demo</a></div><p id="section"></p><img id="slide" alt=""><p id="caption"></p><script>const data=[{"n": 1, "title": "LP, NLP and line search", "part": "Review"}, {"n": 2, "title": "Today’s schedule", "part": "Review"}, {"n": 3, "title": "Opening questions", "part": "Review"}, {"n": 4, "title": "What the primal variables mean", "part": "Review"}, {"n": 5, "title": "What the dual variables mean", "part": "Review"}, {"n": 6, "title": "Derive one dual constraint per product", "part": "Review"}, {"n": 7, "title": "Why the dual gives an upper bound", "part": "Review"}, {"n": 8, "title": "An optimality certificate", "part": "Review"}, {"n": 9, "title": "Complementary slackness", "part": "Review"}, {"n": 10, "title": "Check both zero products", "part": "Review"}, {"n": 11, "title": "Practice: test a proposed price", "part": "Review"}, {"n": 12, "title": "Solution: feasibility comes first", "part": "Review"}, {"n": 13, "title": "Derive the shadow-price interval", "part": "Revie lick=()=>show(n-1);$('next').onclick=()=>show(n+1);$('choose').onchange=e=>show(e.target.value);document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)});show(location.hash.slice(1));</script></body></html>
