<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP clarification slides with narration</title><style>*{box-sizing:border-box}body{margin:0;background:#F3F0EB;color:#333F4A;font:18px/1.65 Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1,h2,a{color:#0F6E6B}h1{font-size:32px;line-height:1.25}a{text-underline-offset:3px}section{margin:30px 0}img{max-width:100%;background:white}button,select{font:inherit;color:#0F6E6B;background:white;border:1px solid #0F6E6B;padding:9px;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.45}nav,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}audio{width:min(100%,520px)}details{background:white;padding:16px;margin:18px 0}summary{cursor:pointer;font-weight:bold}:focus-visible{outline:3px solid #E29A2D}.small{font-size:15px}@media(max-width:600px){main{padding:12px}h1{font-size:26px}}</style></head><body><main><p><a href="index.html">Review materials</a> · <a href="LP-clarification-slides.pdf">PDF</a></p><nav aria-label="Slide navigation"><button id="prev">Previous</button><label>Slide <select id="choose"></select></label><span>/ 23</span><button id="next">Next</button></nav><img id="slide" alt=""><h1 id="title"></h1><div class="controls"><audio id="audio" controls preload="metadata"></audio><label>Speed <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="auto"> Continue automatically</label></div><p id="status" role="status" aria-live="polite">Press Play to listen.</p><details><summary>English transcript</summary><p id="transcript"></p></details><p class="small">AI-generated English narration using Microsoft Guy neural voice. Automatic continuation pauses after the practice question on slide 21.</p></main><script>
const data={"voice": "en-US-GuyNeural", "rate": "-5%", "pitch": "+0Hz", "slides": [{"slide": 1, "title": "LP and duality: questions explained", "script": "This review responds to questions from the LP exit ticket. We will build the dual problem one step at a time, so that each new symbol has a clear meaning. Then we will examine what happens when the first resource increases from four to six units. Keep a pen and paper nearby. Pause at the practice slide and try the calculation before listening to the solution. Throughout the review, production quantities are continuous, as in the original linear program.", "file": "audio/slide-001.mp3", "duration_seconds": 30.72}, {"slide": 2, "title": "The original production problem", "script": "Our original model chooses how much of two products to make. One unit of product x earns three profit units and uses one unit of resource one and two units of resource two. Product y earns two and uses one unit of each resource. We have four units of resource one and five units of resource two. The shaded region shows feasible production plans. For this review, profit and resource quantities use illustrative units. At the marked point, x equals one and y equals three.", "file": "audio/slide-002.mp3", "duration_seconds": 33.6}, {"slide": 3, "title": "Production quantities and resource prices", "script": "The symbols describe different decisions. In the primal, x and y are quantities of products. In the dual, u is a price per unit of resource one, and v is a price per unit of resource two. The letter z labels the profit calculated from x and y. The letter w labels the resource value calculated from u and v. We are constructing a second optimization problem, not substituting u for x or v for y. The optimal objective values will agree, even though the decisions have different meanings.", "file": "audio/slide-003.mp3", "duration_seconds": 35.376}, {"slide": 4, "title": "Step 1: weighting the resource constraints", "script": "We start with the two resource inequalities. Multiply the first by u and the second by v. We require these weights to be nonnegative because multiplication by a nonnegative number preserves the inequality direction. Add the two inequalities. The result says that the priced resource use cannot exceed the value of the available resources. We have not chosen numerical prices yet. We will choose prices that make this expression an upper bound on production profit.", "file": "audio/slide-004.mp3", "duration_seconds": 32.256}, {"slide": 5, "title": "Step 2: collecting product coefficients", "script": "Expand the weighted resource use, then collect terms in x and y. Product x carries the coefficient u plus two v because it consumes one unit of the first resource and two of the second. Product y carries u plus v because it uses one unit of each. This is where the coefficients in the dual constraints come from. Each product column in the primal resource table becomes one constraint in the dual. The coefficients do not come from renaming the production variables.", "file": "audio/slide-005.mp3", "duration_seconds": 29.808}, {"slide": 6, "title": "Step 3: a valid upper bound on profit", "script": "To bound profit from above, the cost assigned to each product must cover its profit coefficient. For x, this means u plus two v must be at least three. For y, u plus v must be at least two. Since x and y are nonnegative, we can multiply these coefficient inequalities by the quantities and add them. This gives the first inequality on the slide. Resource feasibility gives the second. Every feasible production profit is therefore at most four u plus five v whenever the prices satisfy these conditions.", "file": "audio/slide-006.mp3", "duration_seconds": 34.704}, {"slide": 7, "title": "Step 4: the complete dual problem", "script": "Any feasible pair of prices gives an upper bound on profit. We want the smallest such bound, so the dual objective is a minimization. The available resource amounts, four and five, become objective coefficients. Each primal resource row creates one dual variable. Each product column creates one dual constraint. The displayed signs apply to this particular primal form: maximization, less-than-or-equal resource constraints, and nonnegative product quantities. Different primal signs or free variables require the corresponding dual rules, rather than copying this pattern blindly.", "file": "audio/slide-007.mp3", "duration_seconds": 39.072}, {"slide": 8, "title": "A cheap price pair can fail the bound", "script": "Suppose we pick u equal to one and v equal to zero. The resource value is only four, which looks attractive for minimization. But both product coverage constraints fail. A concrete counterexample makes the problem visible: produce zero of x and four of y. This uses four units of each resource, so it is feasible. Its profit is eight, greater than the proposed bound of four. A low objective value alone does not make a dual solution valid. Always check every constraint first.", "file": "audio/slide-008.mp3", "duration_seconds": 34.992}, {"slide": 9, "title": "Matching feasible values certify optimality", "script": "Now use prices u and v both equal to one. Both coverage constraints hold with equality, and the dual objective is nine. The production plan x equal to one and y equal to three is feasible and also earns nine. Weak duality tells us no feasible production plan can earn more than this dual bound. Because we have a plan that reaches it, the plan and the prices are optimal. Notice that the equality is between objective values, z and w. The optimal production quantities and resource prices need not match.", "file": "audio/slide-009.mp3", "duration_seconds": 34.776}, {"slide": 10, "title": "Complementary slackness links the solutions", "script": "Complementary slackness links each variable to the slack in its matching constraint. A positive resource price requires full use of that resource. A positive product quantity requires its assigned cost to equal its profit coefficient. At our baseline solution, both products are positive. Set both dual slacks to zero. Subtract u plus v equals two from u plus two v equals three. This gives v equal to one, then u equal to one. A binding constraint can sometimes have a zero multiplier, so binding by itself does not prove that its price is positive.", "file": "audio/slide-010.mp3", "duration_seconds": 38.88}, {"slide": 11, "title": "Changing the amount of resource 1", "script": "We now vary only the first resource amount, b one. Keep the second resource at five and keep both profit coefficients unchanged. At the baseline, the optimal price of resource one is one. This suggests that an extra small unit of the first resource adds one profit unit. The proposed value formula is nine plus one times the change in b one. Before using it for a finite change, we must find the interval over which the same optimal structure remains valid.", "file": "audio/slide-011.mp3", "duration_seconds": 31.344}, {"slide": 12, "title": "Step 1: the intersection as b₁ changes", "script": "Inside the current regime, both resource constraints bind. Write their boundary equations. Subtract the first from the second to obtain x equal to five minus b one. Substitute this into x plus y equals b one to obtain y equal to two b one minus five. These expressions describe the moving intersection of the resource boundaries. They are only candidate production quantities until we check nonnegativity and optimality. The figure shows how the intersection moves as resource one increases.", "file": "audio/slide-012.mp3", "duration_seconds": 33.96}, {"slide": 13, "title": "Step 2: the allowable interval", "script": "The interval comes directly from nonnegative production. Five minus b one must be at least zero, so b one cannot exceed five. Two b one minus five must be at least zero, so b one must be at least two point five. Combining the conditions gives the allowable interval. Throughout this interval, prices one and one remain dual feasible, and their value equals the feasible intersection's profit. This proves optimality, rather than merely checking that the intersection exists.", "file": "audio/slide-013.mp3", "duration_seconds": 32.16}, {"slide": 14, "title": "Step 3: profit inside the interval", "script": "Substitute the intersection quantities into the original profit function. Three times five minus b one, plus two times two b one minus five, simplifies to b one plus five. Its slope is one, which is the shadow price. For example, increasing the first resource from four to four point two gives x equal to zero point eight and y equal to three point four. The resulting profit is nine point two, exactly matching the shadow-price prediction. This is an exact finite-change result within the stated interval.", "file": "audio/slide-014.mp3", "duration_seconds": 33.888}, {"slide": 15, "title": "Beyond the interval: b₁ = 6", "script": "At b one equal to six, the old intersection formula gives x equal to negative one and y equal to seven. The two resource boundary lines still intersect, but the point is outside the feasible region because negative production is forbidden. The old price formula predicts eleven, but the feasible plan that previously justified equality no longer exists. Prices one and one still give a valid upper bound of eleven. The bound has become loose, so it no longer identifies the optimal value.", "file": "audio/slide-015.mp3", "duration_seconds": 32.184}, {"slide": 16, "title": "Profit per unit of the limiting resource", "script": "Why should we not simply choose x because three is greater than two? One unit of x uses twice as much of the limiting second resource. Compare profit per unit of that resource. Product x earns three divided by two, or one point five. Product y earns two divided by one, or two. In this changed problem, using all five units of resource two for y is feasible for resource one as well. This ratio argument works here because one resource is the effective bottleneck. It is not a general replacement for solving an LP with several binding resources.", "file": "audio/slide-016.mp3", "duration_seconds": 38.952}, {"slide": 17, "title": "The new optimum uses five units of y", "script": "Compare the two axis endpoints. Producing two point five units of x earns seven point five. Producing five units of y earns ten and satisfies both resource limits. We can also substitute y equals five minus two x along the second resource boundary. Profit becomes ten minus x, so moving toward smaller x raises profit along that boundary. The best endpoint is zero x and five y. The next slide proves that no interior point or other feasible point can do better.", "file": "audio/slide-017.mp3", "duration_seconds": 33.528}, {"slide": 18, "title": "A new dual certificate proves the answer", "script": "Use a price of zero for resource one and two for resource two. The dual coverage constraints become four greater than or equal to three, and two equal to two. Both prices are nonnegative, so the pair is feasible. The resource value is ten, which matches the profit of producing five y. That equality proves global optimality for this LP. Resource one has one unit left over, and its price is zero. Product x has zero output and a positive dual slack of one. Both facts fit complementary slackness.", "file": "audio/slide-018.mp3", "duration_seconds": 36.6}, {"slide": 19, "title": "The complete value curve for b₁ ≥ 0", "script": "The whole value curve has three linear pieces. With very little resource one, it is the effective bottleneck, and producing x gives profit three times b one. Between two point five and five, the best plan mixes both products and profit is b one plus five. Above five, producing five y already exhausts resource two, and additional resource one has no value. The slope therefore decreases from three to one to zero. The old straight-line prediction continues above the actual value after b one passes five.", "file": "audio/slide-019.mp3", "duration_seconds": 34.2}, {"slide": 20, "title": "Range endpoints and a finite increase", "script": "For a change from four to six, split the change where the value curve changes slope. The first extra resource unit, from four to five, adds one profit unit. The next unit, from five to six, adds nothing. Total profit increases by one, not two. At the endpoint five, the left and right derivatives differ, so there is no single two-sided marginal value. The baseline price of one still predicts the value at the endpoint correctly, but it cannot predict increases beyond that endpoint. Buying capacity would also require subtracting its purchase cost from this gross gain.", "file": "audio/slide-020.mp3", "duration_seconds": 38.952}, {"slide": 21, "title": "Pause and try the calculation", "script": "Pause the recording and solve both cases before moving on. Keep the second resource at five and the original profit coefficients at three and two. For b one equal to four point six, first check whether the value lies in the allowable interval. Then find the production quantities and verify the resource use. Repeat for five point four, but do not extend the old formula automatically. Finally, find a feasible dual pair whose objective matches each production profit. The solution is on the next slide.", "file": "audio/slide-021.mp3", "duration_seconds": 34.248}, {"slide": 22, "title": "Practice solution and optimality checks", "script": "For case A, the intersection gives x equal to zero point four and y equal to four point two. Resource use is four point six and five, exactly the available amounts. Profit is nine point six. Prices one and one give the same dual value. For case B, the old intersection would have negative x. Use zero x and five y instead. Its profit is ten. Prices zero and two certify that value, while zero point four unit of resource one remains unused. A positive slack forces that resource's optimal price to zero by complementary slackness.", "file": "audio/slide-022.mp3", "duration_seconds": 38.208}, {"slide": 23, "title": "A connected view of primal and dual", "script": "The primal chooses feasible quantities. The dual chooses feasible resource prices that bound the profit. When both feasible values match, we have an optimality certificate. Complementary slackness explains how unused resources and inactive products fit the prices. Shadow prices then describe how the optimal value responds to resource changes, within the appropriate range and direction. If anything remains unclear, use the LP exit ticket feedback field to identify the slide number and the step that caused difficulty. You may write your question in Thai or English.", "file": "audio/slide-023.mp3", "duration_seconds": 37.896}], "total_duration_seconds": 800.304}, total=data.slides.length;

document.getElementById('prev').onclick=()=>show(n-1);document.getElementById('next').onclick=()=>show(n+1);choose.onchange=()=>show(choose.value);speed.onchange=()=>audio.playbackRate=Number(speed.value);audio.onended=()=>{if(auto.checked&&n<total&&n!==21)show(n+1,true)};audio.onerror=()=>status.textContent='Audio could not load. Please reload the page or download the narrated PowerPoint.';window.onhashchange=()=>show(location.hash.slice(1));document.onkeydown=e=>{if(/INPUT|SELECT|BUTTON|AUDIO|SUMMARY/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(n+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(n-1)}};show(location.hash.slice(1));
