# ── Minimal, boring, hard to break. Two knobs matter. ──────────────────
title: SKH Research Group
description: Energy Storage Innovation Laboratory, Chulalongkorn University.
author: Soorathep Kheawhom

baseurl: ""            # site is served at the ROOT of www.skhgroup.net (see CNAME)
home_url: "index.html"    # the one-pager the nav links back to
url: "https://www.skhgroup.net"

permalink: /news/:year/:month/:day/:title/

defaults:
  - scope: {path: "", type: posts}
    values: {layout: post}

plugins:
  - jekyll-feed      # /feed.xml
  - jekyll-sitemap   # /sitemap.xml, so search engines can find every page

# Internal working documents and tooling. They live in the repository, they are not
# part of the published site. Also keeps them out of Liquid: GitHub Pages runs
# jekyll-optional-front-matter, so any .md file left in scope is rendered, and a
# stray Liquid tag inside a guide can break the whole build.
exclude:
  - MAINTENANCE.md
  - NEW_PAPER_GUIDE.md
  - PEOPLE_GUIDE.md
  - SKH_Writing_Program_Editorial_Map.md
  - tools/
  - "Open SKH Dashboard.command"
  - site-snapshot2.tgz
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
